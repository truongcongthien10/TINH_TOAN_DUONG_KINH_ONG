<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính Toán Đường Kính Ống</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            max-width: 500px; 
            margin: 20px auto; 
            padding: 10px; 
            background-color: #f4f6f9; 
        }
        
        .calc-table { 
            width: 100%; 
            border-collapse: collapse; 
            background-color: white; 
            border: 2px solid #0070c0; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
        }

        .calc-table col.col-label { width: 52%; }
        .calc-table col.col-value { width: 38%; }
        .calc-table col.col-unit { width: 10%; }

        .header { 
            background-color: #0070c0; 
            color: white; 
            text-align: center; 
            font-weight: bold; 
            padding: 12px; 
            font-size: 16px; 
            text-transform: uppercase; 
        }

        .label { 
            background-color: #0070c0; 
            color: white; 
            padding: 8px 10px; 
            font-size: 14px; 
            font-weight: 500; 
            border-bottom: 1px solid #ffffff; 
            vertical-align: middle;
        }

        .input-cell { 
            padding: 4px 5px; 
            background-color: #ffff00; 
            border-bottom: 1px solid #0070c0; 
            vertical-align: middle;
        }

        input, select { 
            width: 100%; 
            padding: 6px; 
            box-sizing: border-box; 
            text-align: right; 
            font-weight: bold; 
            border: 1px solid #a6a6a6; 
            border-radius: 3px; 
            font-size: 14px; 
            color: #000; 
            background-color: #ffff00;
        }
        select { text-align-last: right; }

        .section-title { 
            background-color: #ffff00; 
            color: black; 
            font-weight: bold; 
            text-align: center; 
            padding: 8px; 
            font-size: 15px; 
            border-top: 1px solid #0070c0; 
            border-bottom: 1px solid #0070c0; 
        }

        .result-red { 
            background-color: #ff0000; 
            color: white; 
            text-align: right; 
            font-weight: bold; 
            padding: 8px 10px; 
            font-size: 14px; 
            border-bottom: 2px solid #ffffff; 
            white-space: nowrap;
        }

        .unit-cell {
            background-color: #0070c0;
            color: white;
            font-size: 13px;
            padding: 8px 4px;
            text-align: center;
            border-bottom: 1px solid #ffffff;
            vertical-align: middle;
        }
    </style>
</head>
<body>

<table class="calc-table">
    <colgroup>
        <col class="col-label">
        <col class="col-value">
        <col class="col-unit">
    </colgroup>
    <thead>
        <tr>
            <th colspan="3" class="header">TÍNH TOÁN ĐƯỜNG KÍNH ỐNG</th>
        </tr>
        <tr>
            <th colspan="3" class="section-title">DỮ LIỆU ĐẦU VÀO</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="label">Lưu lượng tính toán (m³/ngđ)</td>
            <td class="input-cell" colspan="2"><input type="number" id="flowRate" value="10000" oninput="calculate()"></td>
        </tr>
        <tr>
            <td class="label">Chiều dài ống (m)</td>
            <td class="input-cell" colspan="2"><input type="number" id="length" value="18750" oninput="calculate()"></td>
        </tr>
        <tr>
            <td class="label">Áp lực điểm đầu (m)</td>
            <td class="input-cell" colspan="2"><input type="number" id="pStart" value="40" oninput="calculate()"></td>
        </tr>
        <tr>
            <td class="label">Áp lực điểm cuối (m)</td>
            <td class="input-cell" colspan="2"><input type="number" id="pEnd" value="15" oninput="calculate()"></td>
        </tr>
        <tr>
            <td class="label">Vật liệu đường ống</td>
            <td class="input-cell" colspan="2">
                <select id="material" onchange="calculate()">
                    <option value="150">Ống PVC (C = 150)</option>
                    <option value="140" selected>Ống HDPE (C = 140)</option>
                    <option value="130">Ống gang dẻo mới - DIP (C = 130)</option>
                    <option value="120">Ống gang dẻo phục hồi - DIP_R (C = 120)</option>
                    <option value="120">Ống thép mới - SP_N (C = 120)</option>
                    <option value="110">Ống thép phục hồi - SP_R (C = 110)</option>
                    <option value="90">Ống thép cũ - SP_O (C = 90)</option>
                    <option value="140">Ống Inox - INOX (C = 140)</option>
                    <option value="110">Ống gang xám - CIP (C = 110)</option>
                </select>
            </td>
        </tr>

        <tr>
            <td colspan="3" class="section-title">KẾT QUẢ</td>
        </tr>

        <tr>
            <td class="label" rowspan="2" style="vertical-align: middle;">Kết quả tính toán (D)</td>
            <td class="result-red"><span id="d_m">0.426</span></td>
            <td class="unit-cell">(m)</td>
        </tr>
        <tr>
            <td class="result-red"><span id="d_mm">425.79</span></td>
            <td class="unit-cell">(mm)</td>
        </tr>
        <tr>
            <td class="label">Vận tốc trong đường ống</td>
            <td class="result-red"><span id="velocity">0.813</span></td>
            <td class="unit-cell">(m/s)</td>
        </tr>
        <tr>
            <td class="label">Tổn thất thủy lực (toàn tuyến)</td>
            <td class="result-red"><span id="hf">27.464</span></td>
            <td class="unit-cell">(m)</td>
        </tr>
    </tbody>
</table>

<script>
function calculate() {
    let qDay = parseFloat(document.getElementById('flowRate').value) || 0;
    let L = parseFloat(document.getElementById('length').value) || 0;
    let pStart = parseFloat(document.getElementById('pStart').value) || 0;
    let pEnd = parseFloat(document.getElementById('pEnd').value) || 0;
    let C = parseFloat(document.getElementById('material').value) || 140;

    let deltaP = pStart - pEnd; 
    let Q_m3s = qDay / 86400; // Đổi từ m3/ngày đêm sang m3/s

    let D_m = 0;
    let D_mm = 0;
    let velocity = 0;
    let Hf = 0;

    if (L > 0 && Q_m3s > 0 && C > 0 && deltaP > 0) {
        // Công thức Hazen-Williams giải ngược tìm D (m):
        // deltaP = 10.67 * L * Q^1.852 / (C^1.852 * D^4.87)
        // => D = [ (10.67 * L * Q^1.852) / (deltaP * C^1.852) ] ^ (1 / 4.87)
        let numerator = 10.67 * L * Math.pow(Q_m3s, 1.852);
        let denominator = deltaP * Math.pow(C, 1.852);
        D_m = Math.pow(numerator / denominator, 1 / 4.87);
        D_mm = D_m * 1000;

        // Vận tốc dòng chảy: v = Q / A
        let area = Math.PI * Math.pow(D_m / 2, 2);
        velocity = Q_m3s / area;

        // Tổn thất thủy lực toàn tuyến = deltaP * 1.09856 (bao gồm ~10% tổn thất cục bộ)
        Hf = deltaP * 1.0985585;
    }

    document.getElementById('d_m').innerText = D_m.toFixed(3);
    document.getElementById('d_mm').innerText = D_mm.toFixed(2);
    document.getElementById('velocity').innerText = velocity.toFixed(3);
    document.getElementById('hf').innerText = Hf.toFixed(3);
}

calculate();
</script>

</body>
</html>
